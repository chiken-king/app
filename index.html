<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken King - Pesan Online</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5a0b0d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chicken King">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #fcf8f5; color: #333; padding-bottom: 80px; }
        
        /* Header Container */
        header { 
            background-color: #5a0b0d; 
            color: white; 
            text-align: center; 
            padding: 25px 15px 20px 15px; 
            border-bottom: 4px solid #801315; 
        }
        
        /* Logo Image Style */
        .logo-img { 
            max-width: 220px; 
            width: 75%; 
            height: auto; 
            margin: 0 auto 8px auto; 
            display: block; 
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));
        }

        /* Fallback Logo Teks */
        .logo-fallback {
            display: none;
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 6px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        header p { font-size: 13px; opacity: 0.9; margin-top: 4px; }

        /* Tombol / Link Lokasi Maps */
        .location-link {
            display: inline-block;
            margin-top: 10px;
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: background-color 0.2s;
        }
        .location-link:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* Layout & Main Container */
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        
        /* Banner Install PWA */
        .install-banner { 
            display: none; 
            background: #fff3cd; 
            border: 1px solid #ffeeba; 
            color: #856404; 
            padding: 12px 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            text-align: center; 
            font-size: 14px; 
        }
        .btn-install { 
            background: #801315; 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 4px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-left: 8px; 
        }

        /* Grid Menu Items */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .menu-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; border: 1px solid #eee; }
        .menu-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .menu-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; color: #222; }
        .menu-price { color: #801315; font-weight: bold; font-size: 16px; margin-bottom: 12px; }
        .btn-add { background-color: #801315; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        .btn-add:hover { background-color: #5a0b0d; }

        /* Form & Keranjang */
        .section-title { font-size: 18px; margin-bottom: 15px; border-bottom: 2px solid #801315; padding-bottom: 5px; color: #5a0b0d; font-weight: bold; }
        .cart-section, .form-section { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; border: 1px solid #eee; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #e0e0e0; }
        .cart-controls button { background: #f0f0f0; border: 1px solid #ccc; width: 28px; height: 28px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        
        /* Input Form */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: bold; color: #444; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

        /* Total & Button WA */
        .total-box { font-size: 18px; font-weight: bold; text-align: right; margin-top: 15px; color: #801315; }
        .btn-wa { background-color: #25D366; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; transition: background 0.2s; }
        .btn-wa:hover { background-color: #1ebc57; }
    </style>
</head>
<body>

    <header>
        <!-- Logo PNG dengan Fallback -->
        <img src="logo.png" 
             alt="Chicken King Logo" 
             class="logo-img" 
             id="main-logo"
             onerror="this.style.display='none'; document.getElementById('alt-logo').style.display='block';">
        
        <!-- Logo Cadangan berbasis Teks -->
        <div id="alt-logo" class="logo-fallback">CHICKEN KING</div>

        <p>Pesan Praktis & Cepat via WhatsApp</p>
        
        <!-- Link Alamat Lokasi Google Maps -->
        <a href="https://maps.app.goo.gl/q16dMSzeFJNw7NnDA?g_st=ac" target="_blank" rel="noopener noreferrer" class="location-link">
            📍 Lihat Lokasi di Google Maps
        </a>
    </header>

    <div class="container">
        
        <div id="install-banner" class="install-banner">
            📲 Pasang aplikasi ini di HP kamu!
            <button id="install-btn" class="btn-install">Instal</button>
        </div>

        <h2 class="section-title">Pilih Menu Ayam & Saos</h2>
        <div class="menu-grid" id="menu-container"></div>

        <div class="cart-section">
            <h2 class="section-title">Pesanan Anda</h2>
            <div id="cart-items">
                <p style="color: #777; font-size: 14px;">Keranjang masih kosong.</p>
            </div>
            <div class="total-box">
                Total: Rp <span id="total-price">0</span>
            </div>
        </div>

        <div class="form-section">
            <h2 class="section-title">Data Pesanan (Takeaway)</h2>
            <form id="order-form">
                <div class="form-group">
                    <label>Nama Pemesan</label>
                    <input type="text" id="nama" placeholder="Contoh: Budi Santoso" required>
                </div>
                <div class="form-group">
                    <label>Catatan Pesanan</label>
                    <textarea id="catatan" rows="3" placeholder="Masukkan catatan tambahan (misal: jam pengambilan, tingkat pedas, dll)"></textarea>
                </div>
                <button type="button" class="btn-wa" onclick="sendToWhatsApp()">📲 Pesan Sekarang via WhatsApp</button>
            </form>
        </div>

    </div>

    <script>
        const NO_WHATSAPP = "6281257028511"; 

        const products = [
            { id: 1, name: "Dada / Paha Atas", price: 9000 },
            { id: 2, name: "Sayap / Paha Bawah", price: 8000 },
            { id: 3, name: "Dada / Paha Atas (Geprek)", price: 12000 },
            { id: 4, name: "Sayap / Paha Bawah (Geprek)", price: 11000 },
            { id: 5, name: "Dada / Paha Atas + Nasi", price: 12000 },
            { id: 6, name: "Sayap / Paha Bawah + Nasi", price: 11000 },
            { id: 7, name: "Dada / Paha Atas + Nasi (Geprek)", price: 15000 },
            { id: 8, name: "Sayap / Paha Bawah + Nasi (Geprek)", price: 14000 },
            { id: 9, name: "Saos Black pepper", price: 2000 },
            { id: 10, name: "Saos Barbeque", price: 2000 },
            { id: 11, name: "Saos Pedas", price: 2000 },
            { id: 12, name: "Saos Keju", price: 2000 }
        ];

        let cart = {};

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = products.map(item => `
                <div class="menu-card">
                    <div class="menu-info">
                        <div>
                            <div class="menu-title">${item.name}</div>
                            <div class="menu-price">Rp ${item.price.toLocaleString('id-ID')}</div>
                        </div>
                        <button class="btn-add" onclick="addToCart(${item.id})">+ Tambah</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            if (cart[id]) {
                cart[id].qty += 1;
            } else {
                const product = products.find(p => p.id === id);
                cart[id] = { ...product, qty: 1 };
            }
            updateCartUI();
        }

        function updateQty(id, change) {
            if (cart[id]) {
                cart[id].qty += change;
                if (cart[id].qty <= 0) {
                    delete cart[id];
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsEl = document.getElementById('cart-items');
            const totalPriceEl = document.getElementById('total-price');
            const cartArray = Object.values(cart);
            
            if (cartArray.length === 0) {
                cartItemsEl.innerHTML = '<p style="color: #777; font-size: 14px;">Keranjang masih kosong.</p>';
                totalPriceEl.innerText = '0';
                return;
            }

            let total = 0;
            cartItemsEl.innerHTML = cartArray.map(item => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                return `
                    <div class="cart-item">
                        <div>
                            <strong>${item.name}</strong><br>
                            <small>Rp ${item.price.toLocaleString('id-ID')} x ${item.qty}</small>
                        </div>
                        <div class="cart-controls">
                            <button onclick="updateQty(${item.id}, -1)">-</button>
                            <span style="margin: 0 8px;">${item.qty}</span>
                            <button onclick="updateQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalPriceEl.innerText = total.toLocaleString('id-ID');
        }

        function sendToWhatsApp() {
            const cartArray = Object.values(cart);
            if (cartArray.length === 0) {
                alert("Pilih minimal satu menu terlebih dahulu!");
                return;
            }

            const nama = document.getElementById('nama').value.trim();
            const catatan = document.getElementById('catatan').value.trim();

            if (!nama) {
                alert("Harap isi Nama Pemesan!");
                return;
            }

            let message = `*Halo Chicken King, Saya Mau Pesan (Takeaway):*\n\n`;
            let total = 0;

            cartArray.forEach(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                message += `• ${item.qty}x ${item.name} (Rp ${subtotal.toLocaleString('id-ID')})\n`;
            });

            message += `\n*Total Pesanan:* Rp ${total.toLocaleString('id-ID')}\n\n`;
            message += `*Data Pemesan:*\n`;
            message += `• Nama: ${nama}\n`;
            message += `• Tipe: Takeaway (Ambil di Toko)\n`;
            if (catatan) {
                message += `• Catatan: ${catatan}\n`;
            }

            const encodedMessage = encodeURIComponent(message);
            const waUrl = `https://wa.me/${NO_WHATSAPP}?text=${encodedMessage}`;
            window.open(waUrl, '_blank');
        }

        renderMenu();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        let deferredPrompt;
        const installBanner = document.getElementById('install-banner');
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.style.display = 'block';
        });

        installBtn.addEventListener('click', () => {
            installBanner.style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                });
            }
        });
    </script>
</body>
</html>
